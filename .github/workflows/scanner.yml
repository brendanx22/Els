name: ELS 24/7 Market Scanner

on:
  schedule:
    # Runs every 15 minutes 24/7 (GitHub Actions free tier)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scan-markets:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ELS Autonomous Scanner & Telegram Alerts
        run: |
          curl -s -X GET "https://els-beta.vercel.app/api/cron/scan" \
            -H "User-Agent: ELS-GitHub-Actions-Scanner" \
            --max-time 30 || echo "Scan trigger dispatched"
